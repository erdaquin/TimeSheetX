<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashcardX</title>
<style>
:root{--bg:#dbe5ee;--border:#7d8b98;--text:#1e2832;--muted:#586775;--panel-top:#f9fbfd;--panel-mid:#e9eef3;--panel-bottom:#d5dde5;--card-bg:#f7f9fb;--card-border:#71808d;--shadow:#52657555;color-scheme:light}
*{box-sizing:border-box}html,body{width:100%;min-height:100%}body{margin:0;padding:14px;overflow:hidden;background:repeating-linear-gradient(0deg,#dce5ed 0,#dce5ed 2px,#e9eff4 2px,#e9eff4 4px);color:var(--text);font:13px "Lucida Grande","Helvetica Neue",Arial,sans-serif;user-select:none}.page-shell{width:100%;height:calc(100vh - 28px);display:flex;flex-direction:column;gap:12px}.chrome{background:linear-gradient(180deg,var(--panel-top),var(--panel-mid) 48%,var(--panel-bottom));border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 0 #fff inset,0 -1px 0 #aab4bd inset,0 5px 14px var(--shadow)}.top-bar{min-height:52px;padding:8px;display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:9px;padding:0 10px 0 5px}.brand h1{margin:0;font-size:16px;line-height:1.1;text-shadow:0 1px #fff}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.spacer{flex:1}.btn{min-width:88px;border:1px solid #727f89;border-radius:14px;padding:8px 11px;background:linear-gradient(#fff 0,#f7f8f9 42%,#cfd5da 48%,#e8ecef 82%,#fff 100%);color:#1f2b35;font:700 13px "Lucida Grande","Helvetica Neue",Arial,sans-serif;text-shadow:0 1px #fff;box-shadow:0 1px 0 #fff inset,0 -2px 1px #6e7a8450 inset,0 2px 4px #34495e44;cursor:pointer}.btn:hover{filter:brightness(1.06)}.btn:active{filter:brightness(.92);transform:translateY(1px)}.btn:disabled{opacity:.46;filter:grayscale(.35);cursor:default;transform:none}.btn.blue{color:#fff;text-shadow:0 -1px #173d6d;border-color:#356d9b;background:linear-gradient(#cdefff 0,#74c8ff 43%,#1685e6 49%,#54aff9 82%,#b8e7ff 100%)}.status{min-width:150px;padding:8px 10px;border-left:1px solid #a3afb9;color:#4e5d68;text-align:center;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}.theme-toggle{display:inline-flex;align-items:center;padding:4px 2px;cursor:pointer}.theme-toggle input{position:absolute;width:1px;height:1px;opacity:0}.toggle-track{position:relative;width:42px;height:22px;border:1px solid #657784;border-radius:12px;background:linear-gradient(#f9fbfc 0,#d5dce2 47%,#aab6bf 52%,#eef2f5 100%);box-shadow:0 1px 0 #fff inset,0 -1px 1px #56656f88 inset,0 2px 4px #34495e44}.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border:1px solid #60717e;border-radius:50%;background:radial-gradient(circle at 50% 22%,#fff 0 22%,#dce5eb 45%,#8d9ca8 100%);box-shadow:0 1px 0 #fff inset,0 1px 3px #1e2a3388;transition:transform .18s}.theme-toggle input:checked+.toggle-track{border-color:#326a99;background:linear-gradient(#8fd1ff,#3d9de2 45%,#105f9f 52%,#62b6f1)}.theme-toggle input:checked+.toggle-track .toggle-thumb{transform:translateX(20px)}.app-container{flex:1;min-height:0;display:grid;grid-template-columns:minmax(420px,1fr) 260px;gap:14px}.card-window,.side-panel{min-height:0}.card-window{display:flex;flex-direction:column;overflow:hidden}.titlebar{min-height:38px;display:flex;align-items:center;border-bottom:1px solid #71818f;background:linear-gradient(#edf4fa,#d5dfe8);box-shadow:0 1px 0 #fff inset,0 -1px 0 #a5b1ba inset}.counter{align-self:stretch;min-width:104px;padding:4px 12px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,#dce6ee,#f8fafc 48%,#cbd6df);border-right:1px solid #8999a6;box-shadow:-1px 0 0 #fff inset,0 1px 2px #52657533 inset;text-shadow:0 1px #fff}.counter strong{font-size:18px;letter-spacing:-.4px}.counter small{color:#687580;font-size:9px}.title-text{padding:0 13px;font-weight:800;text-shadow:0 1px #fff}.deck-name{margin-left:auto;padding:0 13px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-wrap{position:relative;flex:1;min-height:280px;padding:26px 30px 22px;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage-wrap:before{content:"";position:absolute;left:12%;right:12%;bottom:13px;height:20px;border-radius:50%;background:#1b2c3b20;filter:blur(10px)}.stage{width:min(740px,100%);height:min(500px,100%);min-height:260px;perspective:1500px}.flashcard{position:relative;width:100%;height:100%;padding:0;border:0;background:transparent;transform-style:preserve-3d;transition:transform 720ms cubic-bezier(.18,.89,.32,1.15);cursor:pointer}.flashcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--card-border);border-radius:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:opacity 90ms linear,visibility 0s linear 90ms;box-shadow:0 1px 0 #fff inset,0 -2px 2px #0002 inset,0 10px 24px #34495e66}.face:before{content:"";position:absolute;z-index:2;left:1px;right:1px;top:1px;height:44%;border-radius:10px 10px 48% 48%;background:linear-gradient(#ffffff99,#ffffff10);pointer-events:none}.front{z-index:2;opacity:1;visibility:visible;background:linear-gradient(#fff,#edf1f4 55%,#d9e0e6)}.front img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}.empty{text-align:center;color:#667582;text-shadow:0 1px #fff}.empty b{display:block;font-size:16px;color:#344552;margin-bottom:4px}.back{z-index:1;opacity:0;visibility:hidden;transform:rotateY(180deg);padding:44px;color:#fff;border-color:#315f8d;background:linear-gradient(#78bdff 0,#398ee8 42%,#1264bf 49%,#287bd2 82%,#69adf2 100%);text-shadow:0 -1px 1px #002658e6,0 1px 1px #0004}.flashcard.flipped .front{opacity:0;visibility:hidden}.flashcard.flipped .back{opacity:1;visibility:visible;transition-delay:0s}.flashcard:not(.flipped) .front{transition-delay:0s}.answer{position:relative;z-index:3;max-width:100%;overflow-wrap:anywhere;text-align:center;font-size:clamp(30px,5vw,60px);font-weight:800;letter-spacing:-1px}.bottom-bar{min-height:55px;padding:8px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid #8a98a4;background:linear-gradient(#f9fbfd,#d5dde5);box-shadow:0 1px 0 #fff inset}.bottom-bar .hint{flex:1;color:#586775;text-align:center;font-size:10px;text-shadow:0 1px #fff}.nav-btn{width:42px;min-width:42px;height:30px;padding:0;font-size:20px;line-height:24px}.side-panel{padding:12px;display:flex;flex-direction:column;gap:11px}.panel-section{padding:10px;border:1px solid #8997a3;border-radius:7px;background:linear-gradient(#f8fafc,#dce4eb);box-shadow:0 1px #fff inset}.panel-section h2{margin:0 0 4px;font-size:14px;text-shadow:0 1px #fff}.panel-section p{margin:0;color:#596875;font-size:11px;line-height:1.45}.side-panel .btn{width:100%;margin-top:8px}.details{display:grid;grid-template-columns:1fr auto;gap:6px 9px;font-size:11px}.details span:nth-child(odd){color:#5a6975}.details strong{text-align:right}.drop-target{outline:3px solid #1685e6;outline-offset:-5px}.kbd{display:inline-block;min-width:20px;padding:1px 4px;border:1px solid #83919c;border-radius:4px;background:linear-gradient(#fff,#d6dde2);color:#34434f;text-align:center;box-shadow:0 1px #fff inset,0 1px 1px #52657544;font:10px ui-monospace,monospace}
:root[data-theme=dark]{--bg:#111820;--border:#526777;--text:#edf5fb;--muted:#a9bac5;--panel-top:#344451;--panel-mid:#253440;--panel-bottom:#18242e;--card-border:#596e7d;color-scheme:dark}:root[data-theme=dark] body{background:repeating-linear-gradient(0deg,#101820 0,#101820 2px,#16232d 2px,#16232d 4px)}:root[data-theme=dark] .chrome{box-shadow:0 1px 0 #708493 inset,0 -1px 0 #0a1117 inset,0 5px 14px #0009}:root[data-theme=dark] .brand h1,:root[data-theme=dark] .brand small,:root[data-theme=dark] .title-text,:root[data-theme=dark] .panel-section h2{color:#eaf3f9;text-shadow:0 -1px #071017}:root[data-theme=dark] .status{color:#b9c8d2;border-left-color:#536775}:root[data-theme=dark] .btn{color:#eaf4fa;text-shadow:0 -1px #071017;border-color:#536a79;background:linear-gradient(#607785,#405563 42%,#1e303b 49%,#354b59 82%,#617886);box-shadow:0 1px 0 #8195a1 inset,0 -2px 1px #101a2155 inset,0 2px 4px #0007}:root[data-theme=dark] .btn.blue{background:linear-gradient(#8fd1ff,#3d9de2 43%,#105f9f 49%,#318dce 82%,#75c8fb);border-color:#4c8db9}:root[data-theme=dark] .titlebar,:root[data-theme=dark] .bottom-bar{background:linear-gradient(#3c4d5a,#202d37);border-color:#0b1319;box-shadow:0 1px 0 #718392 inset,0 -1px 0 #111a21 inset}:root[data-theme=dark] .counter{color:#f2f8fc;background:linear-gradient(#405462,#263640 48%,#17242c);border-color:#111c23;box-shadow:-1px 0 #5b7080 inset,0 1px 3px #0008 inset;text-shadow:0 -1px #061017}:root[data-theme=dark] .counter small,:root[data-theme=dark] .deck-name,:root[data-theme=dark] .bottom-bar .hint{color:#a4b5c0;text-shadow:0 -1px #071017}:root[data-theme=dark] .front{z-index:2;opacity:1;visibility:visible;background:linear-gradient(#26343e,#18232b 58%,#101820)}:root[data-theme=dark] .face{box-shadow:0 1px 0 #718591 inset,0 -2px 2px #0005 inset,0 10px 28px #000b}:root[data-theme=dark] .empty,:root[data-theme=dark] .empty b{color:#b8c8d2;text-shadow:0 -1px #071017}:root[data-theme=dark] .panel-section{border-color:#596d7c;background:linear-gradient(#3b4c59,#24323d);box-shadow:0 1px #718392 inset}:root[data-theme=dark] .panel-section p,:root[data-theme=dark] .details span:nth-child(odd){color:#aabac5}:root[data-theme=dark] .kbd{background:linear-gradient(#526571,#263640);border-color:#637887;color:#eef5fa;box-shadow:0 1px #8195a1 inset}
@media(max-width:820px){body{overflow:auto;padding:10px}.page-shell{height:auto;min-height:calc(100vh - 20px)}.top-bar{flex-wrap:wrap}.brand{width:100%}.spacer{display:none}.status{margin-left:auto}.app-container{grid-template-columns:1fr}.card-window{min-height:610px}.side-panel{min-height:0}.stage-wrap{padding:18px}.stage{height:420px}.drop-note{margin-top:0}}@media(max-width:520px){.top-bar .btn{flex:1;min-width:0}.status{width:100%;border:0;border-top:1px solid #a3afb9}.card-window{min-height:520px}.stage{height:330px}.deck-name{display:none}.bottom-bar .hint{display:none}.answer{font-size:32px}}@media(prefers-reduced-motion:reduce){.flashcard,.toggle-thumb{transition:none}}
</style>
</head>
<body>
<div class="page-shell">
<header class="top-bar chrome" aria-label="Flashcard controls">
  <div class="brand"><div><h1>FlashcardX</h1><small>Local image flashcards</small></div></div>
  <button class="btn blue" id="openFolder">Open Folder</button>
  <button class="btn" id="openFiles">Open Images</button>
  <button class="btn" id="shuffleTop" disabled>Shuffle</button>
  <span class="spacer"></span>
  <label class="theme-toggle" title="Toggle dark Aqua appearance"><input id="theme" type="checkbox" role="switch" aria-label="Dark mode"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>
  <div class="status" id="status">Waiting for a deck</div>
</header>
<main class="app-container">
  <section class="card-window chrome" id="dropZone" aria-label="Flashcard viewer">
    <div class="titlebar"><div class="counter"><strong id="counter">0 / 0</strong><small>Current Card</small></div><div class="title-text">Card Viewer</div><div class="deck-name" id="deckName">No deck loaded</div></div>
    <div class="stage-wrap"><div class="stage"><button class="flashcard" id="card" aria-label="Flip flashcard"><div class="face front" id="front"><div class="empty"><b>No cards loaded</b>Open a folder or drop image files here.</div></div><div class="face back"><div class="answer" id="answer"></div></div></button></div></div>
    <div class="bottom-bar"><button class="btn nav-btn" id="previous" aria-label="Previous card" disabled>&#8249;</button><div class="hint">Click to flip &nbsp; <span class="kbd">Space</span> &nbsp; Navigate &nbsp; <span class="kbd">&#8592;</span> <span class="kbd">&#8594;</span></div><button class="btn nav-btn blue" id="next" aria-label="Next card" disabled>&#8250;</button></div>
  </section>
  <aside class="side-panel chrome" aria-label="Deck tools">
    <div class="panel-section"><h2>Deck</h2><p>The image is the question. Its filename, without the final extension, is the answer.</p></div>
    <div class="panel-section details"><span>Cards</span><strong id="cardTotal">0</strong><span>Position</span><strong id="position">-</strong><span>Order</span><strong id="order">Filename</strong></div>
    <div class="panel-section"><button class="btn" id="shuffle" disabled>Shuffle Deck</button><button class="btn" id="restart" disabled>Restart Deck</button></div>
  </aside>
</main>
</div>
<input id="folderInput" type="file" accept="image/*" webkitdirectory directory multiple hidden>
<input id="fileInput" type="file" accept="image/*" multiple hidden>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),D={folder:$('folderInput'),files:$('fileInput'),card:$('card'),front:$('front'),answer:$('answer'),counter:$('counter'),total:$('cardTotal'),position:$('position'),order:$('order'),status:$('status'),deckName:$('deckName'),drop:$('dropZone'),theme:$('theme')};
let deck=[],index=0,flipped=false,shuffled=false;const imageExt=/\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i;
function release(){deck.forEach(x=>URL.revokeObjectURL(x.url))}
function setStatus(s){D.status.textContent=s}
function load(fileList){release();const list=[...fileList].filter(f=>f.type.startsWith('image/')||imageExt.test(f.name));deck=list.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})).map(file=>({url:URL.createObjectURL(file),answer:file.name.replace(/\.[^.]+$/,''),path:file.webkitRelativePath||file.name}));index=0;flipped=false;shuffled=false;const path=deck[0]?.path||'';D.deckName.textContent=path.includes('/')?path.split('/')[0]:'Selected images';setStatus(deck.length?`Loaded ${deck.length} card${deck.length===1?'':'s'}`:'No supported images found');render()}
function render(){const has=deck.length>0;D.card.classList.toggle('flipped',flipped);['previous','next','shuffle','shuffleTop','restart'].forEach(id=>$(id).disabled=!has);D.counter.textContent=has?`${index+1} / ${deck.length}`:'0 / 0';D.total.textContent=deck.length;D.position.textContent=has?String(index+1):'-';D.order.textContent=shuffled?'Shuffled':'Filename';if(!has){D.front.innerHTML='<div class="empty"><b>No cards loaded</b>Open a folder or drop image files here.</div>';D.answer.textContent='';D.deckName.textContent='No deck loaded';return}D.front.replaceChildren();const img=new Image();img.src=deck[index].url;img.alt='Flashcard question';D.front.append(img);D.answer.textContent=deck[index].answer}
function flip(){if(!deck.length)return;flipped=!flipped;D.card.classList.toggle('flipped',flipped)}function move(n){if(!deck.length)return;index=(index+n+deck.length)%deck.length;flipped=false;render();setStatus(`Card ${index+1} of ${deck.length}`)}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;flipped=false;shuffled=true;render();setStatus('Deck shuffled')}
$('openFolder').onclick=()=>{D.folder.value='';D.folder.click()};$('openFiles').onclick=()=>{D.files.value='';D.files.click()};D.folder.onchange=e=>load(e.target.files);D.files.onchange=e=>load(e.target.files);D.card.onclick=flip;$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('shuffle').onclick=shuffle;$('shuffleTop').onclick=shuffle;$('restart').onclick=()=>{index=0;flipped=false;render();setStatus('Deck restarted')};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.code==='Space'){e.preventDefault();flip()}});
['dragenter','dragover'].forEach(name=>addEventListener(name,e=>{e.preventDefault();D.drop.classList.add('drop-target')}));['dragleave','drop'].forEach(name=>addEventListener(name,e=>{e.preventDefault();D.drop.classList.remove('drop-target')}));addEventListener('drop',e=>load(e.dataTransfer.files));
const THEME_KEY='flashcardx_theme';function applyTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';D.theme.checked=dark}let saved=localStorage.getItem(THEME_KEY);if(saved!=='dark'&&saved!=='light')saved=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';applyTheme(saved);D.theme.onchange=()=>{const theme=D.theme.checked?'dark':'light';localStorage.setItem(THEME_KEY,theme);applyTheme(theme)};
addEventListener('beforeunload',release);render();
})();
</script>
</body>
</html>
