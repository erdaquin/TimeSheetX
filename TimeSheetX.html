<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TimeSheetX</title>
        <style>
            :root {
                --bg: #f0f0f0;
                --border: #ccc;
                --text: #333;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family: "Helvetica Neue", Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
                user-select: none;
            }
            .app-container {
                display: flex;
                gap: 20px;
            }
            .timeline-wrapper {
                background: #f4f4f4;
                border-radius: 12px;
                box-shadow:
                    inset 0 0 10px #0000000d,
                    0 4px 10px #0000001a;
                padding: 20px 10px 20px 20px;
                width: 400px;
                overflow-y: auto;
                max-height: 80vh;
            }
            .timeline-grid {
                position: relative;
                border-right: 1px solid var(--border);
                margin-right: 50px;
                cursor: crosshair;
            }
            .time-marker {
                position: absolute;
                width: 100%;
                border-top: 1px solid #d1d1d1;
                left: 0;
                pointer-events: none;
            }
            .time-marker.half-hour {
                border-top: 1px dashed #e0e0e0;
            }
            .time-label {
                position: absolute;
                right: -45px;
                top: -7px;
                font-size: 10px;
                color: #666;
            }
            .half-hour .time-label {
                font-size: 9px;
                color: #999;
            }
            .task-block {
                position: absolute;
                left: 10px;
                right: 10px;
                border-radius: 8px;
                color: #fff;
                padding: 8px 12px;
                box-shadow:
                    0 4px 6px #0003,
                    inset 0 2px 4px #ffffff4d;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                overflow: hidden;
                font-weight: 500;
                text-shadow: 1px 1px 2px #0005;
                transition: transform 0.1s;
                cursor: default;
            }
            .task-block:hover {
                transform: scale(1.02);
                z-index: 10;
            }
            .task-block.resizing {
                transform: none;
                z-index: 30;
            }
            .task-block.compact {
                padding-top: 4px;
                padding-bottom: 4px;
                align-items: center;
            }
            .task-title {
                font-size: 16px;
                line-height: 1.2;
                width: 62%;
                max-width: 62%;
                white-space: nowrap;
                overflow: hidden;
            }
            .compact .task-title,
            .compact .task-input {
                font-size: 13px;
                line-height: 1.1;
            }
            .task-title-text {
                display: inline-block;
                min-width: max-content;
                will-change: transform;
                pointer-events: none;
            }
            .task-block:hover .task-title.overflowing .task-title-text {
                animation: marquee var(--duration, 5s) linear infinite;
            }
            @keyframes marquee {
                0%,
                12% {
                    transform: translateX(0);
                }
                82%,
                94% {
                    transform: translateX(var(--distance, 0));
                }
                100% {
                    transform: translateX(0);
                }
            }
            .task-input {
                width: 62%;
                min-width: 0;
                padding: 4px 7px;
                border: 1px solid #ffffffcc;
                border-radius: 5px;
                outline: none;
                background: #fffffff0;
                color: #222;
                font: inherit;
                text-shadow: none;
                user-select: text;
            }
            .task-duration {
                font-size: 24px;
                font-weight: bold;
                line-height: 1;
                pointer-events: none;
            }
            .compact .task-duration {
                font-size: 16px;
                line-height: 1.1;
            }
            .task-block.etc {
                background: #fff !important;
                color: #707070;
                border: 1px solid #9b9b9b;
                text-shadow: none;
                box-shadow: 0 2px 5px #0000001f;
            }
            .task-block.etc:after {
                content: "ETC";
                position: absolute;
                left: 6px;
                bottom: 3px;
                font-size: 8px;
                font-weight: 800;
                letter-spacing: 0.8px;
                color: #777;
            }
            .task-block.etc .handle {
                background: #7775;
            }
            .task-block.etc .task-input {
                color: #555;
                border-color: #999;
            }
            .handle {
                position: absolute;
                left: 28%;
                right: 28%;
                height: 8px;
                border-radius: 5px;
                cursor: ns-resize;
                background: #ffffff52;
                opacity: 0;
                transition: 0.12s;
                z-index: 4;
            }
            .handle.start {
                top: 2px;
            }
            .handle.end {
                bottom: 2px;
            }
            .task-block:hover .handle,
            .task-block.resizing .handle {
                opacity: 1;
            }
            .handle:hover {
                background: #ffffffb8;
            }
            .compact .handle {
                height: 5px;
            }
            .compact .handle.start {
                top: 1px;
            }
            .compact .handle.end {
                bottom: 1px;
            }
            .icon-btn {
                position: absolute;
                top: 4px;
                width: 20px;
                height: 20px;
                padding: 0;
                border: 0;
                border-radius: 50%;
                background: #0006;
                color: #fff;
                cursor: pointer;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 5;
            }
            .task-block:hover .icon-btn {
                display: flex;
            }
            .delete {
                right: 4px;
            }
            .edit {
                right: 28px;
                font-size: 10px;
                font-weight: 800;
            }
            .delete:hover {
                background: #dc2626e6;
            }
            .edit:hover {
                background: #000b;
            }
            .ghost {
                position: absolute;
                left: 10px;
                right: 10px;
                border-radius: 8px;
                background: #2ecc7166;
                border: 2px dashed #27ae60;
                pointer-events: none;
                z-index: 20;
            }
            .sidebar {
                width: 170px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            .panel {
                background: #f8f8f8;
                border-radius: 12px;
                padding: 15px;
                box-shadow: 0 4px 10px #0000001a;
                display: flex;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .panel h3 {
                margin: 0;
                font-size: 14px;
            }
            .panel label {
                font-size: 11px;
                text-align: left;
                font-weight: bold;
                color: #555;
            }
            .time-select {
                background: linear-gradient(#e0e0e0, #fff);
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 4px;
                font-size: 13px;
                width: 100%;
            }
            .status {
                font-size: 10px;
                color: #777;
                font-family: monospace;
            }
            .btn {
                border: 0;
                border-radius: 8px;
                padding: 10px;
                font-size: 15px;
                font-weight: bold;
                color: #fff;
                cursor: pointer;
                box-shadow:
                    0 4px 6px #0003,
                    inset 0 2px 4px #ffffff66;
            }
            .reset {
                background: linear-gradient(#e67e22, #a84b00);
                margin-top: auto;
            }
            .action {
                background: linear-gradient(#5c8ae6, #2a52be);
            }
            @media (prefers-reduced-motion: reduce) {
                .task-title-text {
                    animation: none !important;
                }
            }

            /* Early macOS Aqua-inspired skin */

            .task-block {

            .task-block:before {

            /* ETC tab hugs the outside-left edge */

            }
            .task-block.etc:before {
                background: linear-gradient(#ffffffee, #ffffff22);

            .task-block.etc:after {
                content: "ETC";
                position: absolute;
                right: 100%;
                left: auto;
                top: 4px;
                bottom: 4px;

                margin-right: 3px;
                display: flex;
                align-items: center;
                justify-content: center;
                writing-mode: vertical-rl;
                transform: rotate(180deg);
                border: 1px solid #929ca5;
                border-right: 0;
                border-radius: 7px 0 0 7px;
                background: linear-gradient(90deg, #fff, #dfe4e8);
                color: #68737d;

                border-color: #8f1d28;
                color: #fff;
                text-shadow: 0 -1px #74151d;

            /* Darker Aqua task blue for improved text contrast */
            .task-block:not(.etc) {
                color: #ffffff;
                text-shadow:
                    0 -1px 1px rgba(0, 38, 88, 0.9),

                    0 1px 0 #fff inset,
                    0 1px 2px #53606b44;

/* Refined toolbar order and integrated time-bound window chrome */
.top-bar .date-navigator {
    margin-left: 0;
    margin-right: 8px;
}
.top-status {
    margin-left: auto;
}
.timeline-wrapper {
    padding-top: 0;
    overflow: hidden auto;
}
.timeline-toolbar {
    position: sticky;
    top: 0;
    z-index: 40;
    margin: 0 -12px 0 -22px;
    padding: 0;
    display: flex;
    gap: 0;
    background: linear-gradient(180deg, #edf4fa 0%, #d5dfe8 100%);
    border: 0;
    border-bottom: 1px solid #71818f;
    border-radius: 9px 9px 0 0;
    box-shadow: 0 1px 0 #fff inset, 0 -1px 0 #a5b1ba inset, 0 3px 7px #5265753d;
    overflow: hidden;
}
.timeline-toolbar::before {
    content: "Time Entry Bounds";
    display: flex;
    align-items: center;
    padding: 0 12px;
